<article class="stat-block"><p class="eyebrow">{{ title }}</p><div class="stats-grid"><div><strong>{{ stats.clan_stars }}</strong><span>★ принесено клану</span></div><div><strong>{{ stats.attended }}<small>/{{ stats.wars }}</small></strong><span>явка / боёв</span></div><div><strong>{{ stats.missed }}</strong><span>пропусков</span></div><div><strong>{{ stats.average|floatformat:1 }}</strong><span>★ в среднем</span></div><div><strong>{{ stats.success }}</strong><span>атак на 2+ ★</span></div><div><strong>{{ stats.attacks }}</strong><span>всего атак</span></div></div></article>
